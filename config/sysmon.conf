# ==============================================================================
# System Monitor Configuration
# ==============================================================================
# Main configuration file for CS350 Real-Time System Monitor
#
# All values are in percentages unless otherwise specified
# ==============================================================================

# --- Resource Usage Thresholds ---
# Alerts will trigger when usage exceeds these limits

# CPU usage warning threshold (%)
CPU_LIMIT=80

# RAM usage warning threshold (%)
RAM_LIMIT=85

# Disk usage warning threshold (%)
DISK_LIMIT=90

# Network packet rate warning threshold (packets/second)
NET_PACKET_LIMIT=100

# --- Monitoring Settings ---

# Base monitoring interval in seconds
INTERVAL_SECONDS=5

# Enable verbose logging (0=off, 1=on)
VERBOSE_LOGGING=0

# --- Starvation Detection ---

# Seconds before a task is considered starving
STARVATION_THRESHOLD=30

# --- Log Rotation ---

# Maximum log file size in KB before rotation
MAX_LOG_SIZE_KB=1024

# Number of archived logs to keep
MAX_LOG_ARCHIVES=5
