<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Monitor Report - 2025-12-31 12:03:29</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-green: #22c55e;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header .timestamp {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .header .status {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .header .status.ok { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
        .header .status.warning { background: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); }
        .header .status.critical { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .card h2 {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .card .value {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .card .value.cpu { color: var(--accent-blue); }
        .card .value.ram { color: var(--accent-purple); }
        .card .value.disk { color: var(--accent-pink); }

        /* Progress Bars */
        .progress-container {
            height: 12px;
            background: var(--bg-primary);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .progress-bar.cpu { background: linear-gradient(90deg, #2563eb, #60a5fa); }
        .progress-bar.ram { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
        .progress-bar.disk { background: linear-gradient(90deg, #db2777, #f472b6); }

        .progress-bar.warning { background: linear-gradient(90deg, #d97706, #fbbf24); }
        .progress-bar.critical { background: linear-gradient(90deg, #dc2626, #f87171); }

        /* Status Badge */
        .card .badge {
            display: inline-block;
            margin-top: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge.ok { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
        .badge.warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); }
        .badge.critical { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

        /* Alerts Section */
        .alerts-container { margin-bottom: 24px; }

        .alert-item {
            background: var(--bg-secondary);
            border-left: 4px solid var(--border);
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 0 8px 8px 0;
        }

        .alert-item.warning { border-left-color: var(--accent-yellow); }
        .alert-item.critical { border-left-color: var(--accent-red); }

        .alert-item .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .alert-item .severity {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .severity.warning { background: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); }
        .severity.critical { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

        .alert-item .timestamp {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .alert-item .message {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .no-alerts {
            text-align: center;
            padding: 40px;
            color: var(--accent-green);
        }

        .no-alerts .icon { font-size: 3rem; margin-bottom: 12px; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .header h1 { font-size: 1.8rem; }
            .card .value { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 System Monitor Report</h1>
        <p class="timestamp">Generated: 2025-12-31 12:03:29</p>
        <span class="status ok">✓ All Systems Normal</span>
    </div>

    <div class="grid">
        <div class="card">
            <h2>CPU Usage</h2>
            <div class="value cpu">2.6%</div>
            <div class="progress-container">
                <div class="progress-bar cpu ok" style="width: 3%"></div>
            </div>
            <span class="badge ok">Normal</span>
        </div>
        <div class="card">
            <h2>RAM Usage</h2>
            <div class="value ram">53.1%</div>
            <div class="progress-container">
                <div class="progress-bar ram ok" style="width: 53%"></div>
            </div>
            <span class="badge ok">Normal</span>
        </div>
        <div class="card">
            <h2>Disk Usage</h2>
            <div class="value disk">36.1%</div>
            <div class="progress-container">
                <div class="progress-bar disk ok" style="width: 36%"></div>
            </div>
            <span class="badge ok">Normal</span>
        </div>
    </div>

    <div class="card alerts-container">
        <h2>⚠️ Recent Alerts</h2>
        <div class="no-alerts">
            <div class="icon">✓</div>
            <p>No alerts - System running smoothly</p>
        </div>
    </div>

    <div class="footer">
        <p>CS350 Real-Time System Monitor | Generated by report_generator</p>
    </div>
</div>
</body>
</html>
